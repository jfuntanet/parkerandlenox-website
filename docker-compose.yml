services:
  parker-lenox-site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://parkerandlenox.com}
    image: parker-lenox-site:latest
    container_name: parker-lenox-site
    restart: unless-stopped
    env_file: .env
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      # ── Router PROD (parkerandlenox.com + www) ──
      # Cert LE emitido vía HTTP-01 (ver ref_traefik_http_01_resolver).
      # Middleware redirige www → apex conservando path/query.
      - "traefik.http.routers.plx-prod.rule=Host(`parkerandlenox.com`) || Host(`www.parkerandlenox.com`)"
      - "traefik.http.routers.plx-prod.middlewares=plx-www-to-apex@docker"
      - "traefik.http.routers.plx-prod.entrypoints=websecure"
      - "traefik.http.routers.plx-prod.tls=true"
      - "traefik.http.routers.plx-prod.tls.certresolver=myhttpchallenge"
      - "traefik.http.routers.plx-prod.tls.domains[0].main=parkerandlenox.com"
      - "traefik.http.routers.plx-prod.tls.domains[0].sans=www.parkerandlenox.com"
      - "traefik.http.routers.plx-prod.priority=100"
      - "traefik.http.routers.plx-prod.service=plx-site"
      - "traefik.http.middlewares.plx-www-to-apex.redirectregex.regex=^https?://www\\.parkerandlenox\\.com/(.*)"
      - "traefik.http.middlewares.plx-www-to-apex.redirectregex.replacement=https://parkerandlenox.com/$${1}"
      - "traefik.http.middlewares.plx-www-to-apex.redirectregex.permanent=true"
      # ── Service ──
      - "traefik.http.services.plx-site.loadbalancer.server.port=3000"

networks:
  n8n_default:
    external: true
